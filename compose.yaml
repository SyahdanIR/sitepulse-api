services:
  postgres:
    image: postgres:17
    container_name: sitepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitepulse
      POSTGRES_PASSWORD: sitepulse
      POSTGRES_DB: sitepulse
    ports: 
      - "5432:5432"
    volumes:
      - sitepulse_postgres_data:/var/lib/postgresql/data

volumes:
  sitepulse_postgres_data:
